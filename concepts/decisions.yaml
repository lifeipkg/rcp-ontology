schema: rcp.concepts/v1
# TBox：决策等级语义。必须与 rcp-contracts/contracts/schemas/decision.yaml
# 以及 rcp-core 的 Decision 枚举逐字一致（红线 RL-003）。
enum:
  - code: PASS
    zh: 放行
    base_score: 0
    meaning: 未命中或命中但无风险，正常分发。

  - code: WARN
    zh: 提示
    base_score: 20
    meaning: 存在风险信号但不拦截，仅对当事人提示（如求职侧命中诱导话术）。

  - code: LIMIT
    zh: 限流
    base_score: 40
    meaning: 限制触达频次或曝光范围，保留业务通路。

  - code: EXTRA_REVIEW
    zh: 加审
    base_score: 60
    meaning: 转人工或二次审核，通过后才可分发。

  - code: INTERCEPT
    zh: 拦截
    base_score: 80
    meaning: 直接阻断本次分发（重复洗稿、招聘侧飞单）。

  - code: BAN
    zh: 封禁
    base_score: 100
    meaning: 账号级处置，需与账号体系联动。
