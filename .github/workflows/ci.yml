name: ontology

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 契约仓只提供 OpenAPI 与生成的决策 schema；声明真源在本仓 ontology/。
      # 单仓 CI 里 RL-003 的 rcp-core 对端不在，检查器会输出 S003 说明未比对。
      - name: 检出契约仓
        uses: actions/checkout@v4
        with:
          repository: lifeipkg/rcp-contracts
          path: rcp-contracts

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: python -m pip install -r requirements.txt

      - name: 单元测试（含每条红线的反例）
        run: python -m pytest -q

      - name: 一致性检查
        run: python rcp_ontology/cli.py check --contracts rcp-contracts
