name: ontology

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检出契约仓
        uses: actions/checkout@v4
        with:
          repository: lifeipkg/rcp-contracts
          path: .deps/rcp-contracts

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: python -m pip install -r requirements.txt

      - name: 单元测试（含每条红线的反例）
        run: python -m pytest -q

      - name: 一致性检查
        run: python rcp_ontology/cli.py check --contracts .deps/rcp-contracts
